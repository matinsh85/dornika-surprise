<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Dornika 🤍</title>

<style>
body {
  font-family: Arial;
  text-align: center;
  padding: 40px;
  background: linear-gradient(135deg, #0b3d2e, #1e7f5c, #b30000);
  color: white;
}

.box {
  background: rgba(255,255,255,0.95);
  color: #333;
  padding: 25px;
  border-radius: 15px;
  max-width: 450px;
  margin: auto;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.question {
  margin-top: 20px;
  font-weight: bold;
}

.option {
  display: block;
  width: 85%;
  margin: 8px auto;
  padding: 10px;
  border: none;
  border-radius: 8px;
  background: #6c8cff;
  color: white;
  cursor: pointer;
}

.option:hover {
  background: #4a6fff;
}

/* 🎉 popup message */
#popup {
  margin-top: 15px;
  font-weight: bold;
  display: none;
}

#surprise {
  display: none;
  margin-top: 20px;
  font-size: 18px;
  animation: fadeIn 1.5s ease-in-out;
}

@keyframes fadeIn {
  from {opacity: 0;}
  to {opacity: 1;}
}
</style>
</head>

<body>

<div class="box">

<h2>Hey Dornika… just a quick one 😊</h2>

<div class="question">1. If studying was a sport?</div>
<button class="option" onclick="answer('q1','gold')">🥇 Gold</button>
<button class="option" onclick="answer('q1','silver')">🥈 Silver</button>
<button class="option" onclick="answer('q1','bronze')">🥉 Bronze</button>

<div class="question">2. Why do people check their phone?</div>
<button class="option" onclick="answer('q2','someone important')">Someone important</button>
<button class="option" onclick="answer('q2','just checking')">Just checking</button>
<button class="option" onclick="answer('q2','checking time')">Checking time</button>

<div class="question">3. If someone wishes you luck?</div>
<button class="option" onclick="answer('q3','caring')">Caring</button>
<button class="option" onclick="answer('q3','supporting')">Supporting</button>
<button class="option" onclick="answer('q3','thinking about me')">Thinking about me</button>

<div class="question">4. What do I call you every time?</div>
<button class="option" onclick="answer('q4','chaloos')">Chaloos</button>
<button class="option" onclick="answer('q4','kooshooloo')">Kooshooloo</button>
<button class="option" onclick="answer('q4','niki')">Niki</button>

<div id="popup"></div>

<div id="surprise">
🎉 Well… look at you Dornika 😄 <br><br>

You actually did it… nicely done 😉 <br><br>

Someone’s definitely been cheering you on 👀✨
</div>

</div>

<audio id="music" src="https://www.bensound.com/bensound-music/bensound-romantic.mp3"></audio>

<script>
let answers = {
  q1: null,
  q2: null,
  q3: null,
  q4: null
};

function answer(q, val) {
  answers[q] = val;

  let popup = document.getElementById("popup");

  // check correct answers step-by-step
  if (
    answers.q1 === "gold" &&
    answers.q2 === "someone important" &&
    answers.q3 === "caring" &&
    answers.q4 === "kooshooloo"
  ) {
    document.getElementById("surprise").style.display = "block";
    popup.style.display = "none";

    document.getElementById("music").play().catch(() => {});
    return;
  }

  // show per-click feedback
  if (
    (q === "q1" && val === "gold") ||
    (q === "q2" && val === "someone important") ||
    (q === "q3" && val === "caring") ||
    (q === "q4" && val === "kooshooloo")
  ) {
    popup.style.display = "block";
    popup.innerText = "🎉 Congrats! keep going 😊";
    popup.style.color = "green";
  } else {
    popup.style.display = "block";
    popup.innerText = "😅 Not quite, try again";
    popup.style.color = "red";
  }
}
</script>

</body>
</html>
